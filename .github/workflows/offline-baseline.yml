name: Offline baseline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon0
      - name: Install locked dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements.lock
          .venv/bin/python -m pip check
      - name: Check browser arm controls
        run: |
          .venv/bin/python -m unittest discover -s tests -p 'test_arm_*.py'
          node --test tests/test_arm_*.mjs
      - name: Run hardware-independent baseline
        run: scripts/check_offline_baseline.sh
      - name: Preserve logs and rendered evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-baseline
          path: evidence/runs/
